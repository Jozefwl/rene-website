apiVersion: apps/v1
kind: Deployment
metadata:
  name: rene-website
  namespace: apps
  labels:
    app: rene-website
    version: 0.1.3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rene-website
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: rene-website
        version: 0.1.3
    spec:
      nodeSelector:
        power: low
      imagePullSecrets:
        - name: harbor-credentials
      containers:
        - name: rene-website
          image: harbor.waldoserver.top/cloud/rene-website:0.1.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              protocol: TCP
          resources:
            requests:
              cpu: 32m
              memory: 48Mi
            limits:
              cpu: 128m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      terminationGracePeriodSeconds: 30
